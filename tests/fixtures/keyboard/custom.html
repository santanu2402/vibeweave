<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyboard fixture: custom radios</title>
<link rel="icon" href="data:,">
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1f2937; background: #fff; } main { padding: 16px; }
  fieldset { border: 1px solid #9ca3af; margin: 12px 0; padding: 12px; }
  label { position: relative; display: inline-block; margin: 4px; }
  label input { position: absolute; inset: 0; opacity: 0; margin: 0; }
  label span { display: inline-block; padding: 10px 14px; border: 1px solid #6b7280; border-radius: 8px; }
  /* quiet: the focus ring is drawn on the visible stand-in */
  .good input:focus-visible + span { outline: 3px solid #0f5f68; outline-offset: 2px; }
  a:focus-visible { outline: 3px solid #0f5f68; }
  /* planted: .bad has no focus style anywhere — keyboard users can't see where they are */
</style>
</head>
<body>
<main>
  <h1>Custom radios</h1>
  <a href="#main">Skip</a>
  <fieldset class="good"><legend>Good</legend>
    <label><input type="radio" name="good" value="good-one"><span>One</span></label>
    <label><input type="radio" name="g2" value="good-two"><span>Two</span></label>
  </fieldset>
  <fieldset class="bad"><legend>Bad</legend>
    <label><input type="radio" name="bad" value="bad-uno"><span>Uno</span></label>
    <label><input type="checkbox" name="b2" value="bad-dos"><span>Dos</span></label>
  </fieldset>
</main>
</body>
</html>
